name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    env:
      PUPPETEER_CACHE_DIR: ${{ runner.temp }}/lantern-browser
      XDG_CACHE_HOME: ${{ runner.temp }}/lantern-worker-cache
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install npm
        run: npm install --global npm@12.2.1
      - name: Install dependencies
        run: npm ci
      - name: Enable Chrome sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Chrome from a clean cache
        timeout-minutes: 5
        run: npm run browser:install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and validate both Workers and the Python container
        timeout-minutes: 10
        run: npm run validate
